services:
  - type: web
    name: smartface
    runtime: python
    buildCommand: pip install dlib-bin==20.0.1 && pip install -r requirements.txt
    startCommand: python serve.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TOLERANCE
        value: 0.45
      - key: LATE_TIME
        value: "08:00:00"
      - key: BRIGHTNESS_THRESHOLD
        value: 50
      - key: UPLOAD_DIR
        value: uploads/face_samples